name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Least privilege: every job reads the repository and nothing else, except
# the provenance job, which runs only for v* tags (see below). Third-party
# actions are pinned by commit SHA (the comment names the version).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the exact toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # ssh-keygen and a throwaway, unprivileged sshd on 127.0.0.1 are used by
      # the OpenSSH cross-check tests (skipped if absent).
      - run: sudo apt-get update && sudo apt-get install -y openssh-client openssh-server
      # Includes: site migration, two-site detection fixtures, AWAY semantics,
      # ambiguous names, completion, support-bundle redaction (adversarial),
      # import hardening. Every test uses temporary HOME/XDG/state/socket
      # directories and a simulated network; none touches this runner's
      # network, configuration or systemd user manager.
      - run: cargo test --workspace --locked

  dependencies:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
      - run: cargo deny check
      - run: cargo audit --deny warnings
      # THIRD_PARTY_LICENSES.md must describe exactly this Cargo.lock.
      - name: third-party notices match Cargo.lock
        run: |
          grep -q "Cargo.lock sha256: $(sha256sum Cargo.lock | cut -d' ' -f1)" THIRD_PARTY_LICENSES.md

  secrets:
    # Secret scanning over the full history (allowlist: .gitleaks.toml).
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: |
          docker run --rm -v "$PWD:/repo:ro" \
            zricethezav/gitleaks:v8.21.2@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46 \
            git /repo --log-opts=--all --config /repo/.gitleaks.toml \
            --gitleaks-ignore-path /repo/.gitleaksignore --redact

  release:
    # Artifacts are built by scripts/release.sh in the pinned Ubuntu 20.04
    # container (glibc 2.31 baseline) from a clean `git archive` of HEAD,
    # with a CycloneDX SBOM (scripts/sbom.sh) and SHA256SUMS. Tagged builds
    # also get a signed SLSA build-provenance attestation (Sigstore, keyless),
    # verifiable with `gh attestation verify <file> --repo yusufdxb/lablink`.
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    needs: [lint, test, dependencies, secrets]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/release.sh
      - name: binaries need at most glibc 2.31
        run: |
          d=$(mktemp -d)
          dpkg-deb -x dist/lablink_*_amd64.deb "$d"
          for b in "$d"/usr/bin/*; do
            v=$(objdump -T "$b" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
            echo "$(basename "$b"): GLIBC_$v"
            [ "$(printf '%s\n2.31\n' "$v" | sort -V | tail -1)" = 2.31 ]
          done
      - name: checksums cover every artifact
        run: |
          cd dist && sha256sum -c SHA256SUMS
          for f in *; do [ "$f" = SHA256SUMS ] || grep -q " ./$f$" SHA256SUMS || { echo "unlisted: $f"; exit 1; }; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lablink-dist
          path: dist/

  provenance:
    # The only job that can obtain an OIDC token, and only for a v* tag: no
    # pull-request or branch code ever runs with it. It runs no repository
    # code; it signs the artifacts the release job built for this tag.
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    needs: [release]
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lablink-dist
          path: dist
      - run: cd dist && sha256sum -c SHA256SUMS
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: "dist/*.deb, dist/*.tar.gz, dist/*.cdx.json"

  cleanroom:
    # Fresh users install the .deb and the tarball on clean Ubuntu containers
    # with systemd: init with a site, discover, adopt, trust, copy-id,
    # exec/ssh, doctor, GUI (wizard and full GUI-only workflow on Xvfb),
    # export/import, support bundle, two sites (AWAY, auto-detection, manual
    # override, ambiguous names, scan restriction), security stop, package
    # removal, tarball install/uninstall. No lab hardware.
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    needs: [release]
    strategy:
      fail-fast: false
      matrix:
        base: ["ubuntu:20.04", "ubuntu:22.04", "ubuntu:24.04"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lablink-dist
          path: dist/
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: BASE=${{ matrix.base }} scripts/cleanroom.sh "$RUNNER_TEMP/cleanroom"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cleanroom-${{ strategy.job-index }}
          path: ${{ runner.temp }}/cleanroom/

  reproduce:
    # A second build of the same commit on a different runner, from scratch
    # (fresh builder image and cargo registry): every artifact must match the
    # release job's, byte for byte.
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    needs: [release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lablink-dist
          path: ${{ runner.temp }}/first-build
      - run: scripts/release.sh
      - run: scripts/reproduce-check.sh "$RUNNER_TEMP/first-build" dist

  baseline:
    # The previous release (0.3.0), built the same way, for the upgrade test.
    # Pinned to the 0.3.0 commit; it never changes.
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 17a0e1f0d2104bac67e79df3a5fc98dac5640d5b
          persist-credentials: false
      # 0.3.0's package.sh pipes `lablink version` into `head -1` under
      # pipefail, which can randomly exit 141 (SIGPIPE; fixed after 0.4.0).
      # The source is frozen, so retry that one exit code only.
      - run: |
          for attempt in 1 2 3; do
            rc=0; scripts/release.sh || rc=$?
            [ "$rc" -ne 141 ] && exit "$rc"
            echo "baseline: release.sh exited 141 (SIGPIPE race), attempt $attempt of 3"
          done
          exit 141
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lablink-baseline-0.3.0
          path: dist/lablink_0.3.0_amd64.deb

  upgrade:
    # A working 0.3.0 install (site, devices, pinned keys, open SSH session)
    # is upgraded with the real 0.3.1 .deb: state preserved, old daemon
    # refused by security-sensitive commands, restart, everything recovers.
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    needs: [release, baseline]
    strategy:
      fail-fast: false
      matrix:
        base: ["ubuntu:20.04", "ubuntu:22.04", "ubuntu:24.04"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lablink-dist
          path: dist/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lablink-baseline-0.3.0
          path: baseline/
      - run: BASE=${{ matrix.base }} scripts/upgrade-test.sh baseline/lablink_0.3.0_amd64.deb "$RUNNER_TEMP/upgrade"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upgrade-${{ strategy.job-index }}
          path: ${{ runner.temp }}/upgrade/

  aarch64-check:
    # Keep the CLI and daemon portable to Jetson-class aarch64 Linux (compile only).
    timeout-minutes: 60
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release --locked -p lablink-daemon -p lablink-cli
