# Temporary, branch-only regeneration helper. Delete before merging.
name: YAML migration bootstrap
on:
  push:
    branches: [fix/yaml-parser-maintenance-2026-10-30]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.ref == 'refs/heads/fix/yaml-parser-maintenance-2026-10-30'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: true
      - run: rustup toolchain install
      - name: Resolve changed dependencies
        run: cargo metadata --format-version 1 > /dev/null
      - name: Reject old YAML dependencies
        run: |
          if grep -Eq '^name = "(serde_yaml_ng|unsafe-libyaml)"$' Cargo.lock; then
            echo "Obsolete YAML dependencies remain" >&2
            exit 1
          fi
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-about
      - name: Regenerate third-party notices
        run: scripts/third-party.sh
      - name: Commit generated files on this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock THIRD_PARTY_LICENSES.md
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "chore: regenerate YAML migration lockfile and notices"
          git push origin HEAD:fix/yaml-parser-maintenance-2026-10-30
