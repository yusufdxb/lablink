# cargo-deny policy: `cargo deny check` (CI and before every release).

[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
all-features = false

[advisories]
# Every RustSec advisory fails the check unless it is listed here with a
# reason after investigation.
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "Unmaintained notice only (no vulnerability): zvariant/zbus_names were merged into zbus 6. Reached only through eframe -> accesskit (Linux screen-reader support); the newest accesskit_unix (0.24.1) still requires zbus 5, so no upgrade exists. Revisit when accesskit moves to zbus 6." },
    { id = "RUSTSEC-2026-0371", reason = "Unmaintained notice only (no vulnerability): zvariant/zbus_names were merged into zbus 6. Reached only through eframe -> accesskit (Linux screen-reader support); the newest accesskit_unix (0.24.1) still requires zbus 5, so no upgrade exists. Revisit when accesskit moves to zbus 6." },
    { id = "RUSTSEC-2026-0372", reason = "Unmaintained notice only (no vulnerability): zvariant/zbus_names were merged into zbus 6. Reached only through eframe -> accesskit (Linux screen-reader support); the newest accesskit_unix (0.24.1) still requires zbus 5, so no upgrade exists. Revisit when accesskit moves to zbus 6." },
    { id = "RUSTSEC-2026-0192", reason = "Unmaintained notice only (no vulnerability): ttf-parser is no longer maintained. Reached only through winit -> sctk-adwaita -> ab_glyph, which renders the window title of the Wayland client-side decorations from a local system font; no safe upgrade exists (ab_glyph 0.2.32 is the newest). Alternatives: winit's wayland-csd-adwaita-notitle (no title text) or -crossfont (FreeType/fontconfig). Revisit when ab_glyph or sctk-adwaita moves to skrifa." },
]

[licenses]
# Licenses compatible with distributing LabLink under Apache-2.0.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "0BSD",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
