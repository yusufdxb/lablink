[package]
name = "lablink-files"
description = "Bounded background SFTP workspace and safe file transfers for LabLink"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
lablink-core.workspace = true
lablink-ssh.workspace = true
tokio = { workspace = true, features = ["rt", "process", "io-util", "time", "sync", "macros"] }
tokio-util.workspace = true
russh-sftp = "=3.0.1"
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid = { version = "1", features = ["v4"] }
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
