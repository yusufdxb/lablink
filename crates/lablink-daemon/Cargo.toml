[package]
name = "lablink-daemon"
description = "lablinkd: owns LabLink's network state and serves it over a local Unix socket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "lablinkd"
path = "src/main.rs"

[dependencies]
lablink-core.workspace = true
lablink-ssh.workspace = true
lablink-discovery.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "net", "time", "sync", "macros", "signal", "io-util", "fs"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
ipnet.workspace = true
libc.workspace = true
rusqlite.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "net", "time", "sync", "macros", "signal", "io-util", "fs", "test-util"] }
