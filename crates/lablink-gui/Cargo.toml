[package]
name = "lablink-gui"
description = "lablink-gui: native desktop client for lablinkd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[[bin]]
name = "lablink-gui"
path = "src/main.rs"

[dependencies]
lablink-core.workspace = true
lablink-ssh.workspace = true
lablink-doctor.workspace = true
lablink-setup.workspace = true
serde_json.workspace = true
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }
# eframe's default features turn this on through `winit/default`; with
# default features off, winit draws a bare fallback frame on Wayland
# compositors without server-side decorations (GNOME). Adwaita-style
# client-side decorations instead: title, native-looking buttons, the
# desktop's button layout, light/dark following the window theme.
winit = { version = "0.30.13", default-features = false, features = ["wayland-csd-adwaita"] }

lablink-files = { path = "../lablink-files" }
rfd = "0.17.2"
jiff = { version = "1", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile.workspace = true
