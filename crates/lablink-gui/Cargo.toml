[package]
name = "lablink-gui"
description = "lablink-gui: native desktop client for lablinkd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[[bin]]
name = "lablink-gui"
path = "src/main.rs"

[dependencies]
lablink-core.workspace = true
lablink-ssh.workspace = true
lablink-doctor.workspace = true
lablink-setup.workspace = true
serde_json.workspace = true
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }

lablink-files = { path = "../lablink-files" }
rfd = "0.17.2"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile.workspace = true
